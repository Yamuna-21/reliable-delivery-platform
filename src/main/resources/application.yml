server:
  port: 8080
spring:
  application:
    name: reliable-delivery-platform
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
info:
  app:
    name: Reliable Delivery Platform
    description: Demo service for an end-to-end DevOps delivery workflow
